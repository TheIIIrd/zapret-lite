# Настройки zapret-lite поверх штатного zapret.service.
#
# Drop-in, а не правка юнита: обновление zapret перезапишет
# zapret.service, а этот файл переживёт, и наоборот - удаление
# zapret-lite не оставит следов в юните апстрима.
#
# Здесь намеренно нет ProtectSystem/CapabilityBoundingSet и прочего
# sandbox: init-скрипт zapret поднимает правила iptables/nft и ему
# нужен root. Ужесточение сломало бы работу. Весь hardening вынесен
# в zapret-lite-check-update.service, которому root не нужен.

[Unit]
Description=zapret (управляется zapret-lite)
# Ограничитель на случай, если старт стабильно не удаётся: systemd
# должен сдаться, а не долбить перезапуском вечно.
#
# Значения близки к штатным для systemd (5 за 10 секунд). Ранее здесь
# стояло 5 за 300 секунд - в тридцать раз строже, - и это ломало
# обычную работу: каждое переключение стратегии, типа firewall или
# режима IPv6 останавливает и запускает службу, и на пятом подряд
# systemd отказывался со start-limit-hit. Ограничитель должен защищать
# от аварийного цикла, а не от намеренных действий человека.
StartLimitIntervalSec=30
StartLimitBurst=6
Documentation=https://github.com/bol-van/zapret
After=network-online.target nss-lookup.target
Wants=network-online.target

[Service]
# Апстрим ставит Restart=no.
#
# on-failure здесь бесполезен, и это проверено: у службы Type=forking
# без главного PID, systemd следит за cgroup. Когда nfqws убит и cgroup
# опустела, юнит завершается как "Deactivated successfully" - то есть
# успешно, - и on-failure не срабатывает. Обход тихо перестаёт работать.
#
# always реагирует и на такое завершение. От аварийного цикла защищает
# ограничитель ниже; намеренная остановка через systemctl stop перезапуск
# не вызывает.
Restart=always
RestartSec=5s

# Без этого journalctl -u zapret пуст ровно тогда, когда он нужнее всего.
StandardOutput=journal
StandardError=journal
SyslogIdentifier=zapret
